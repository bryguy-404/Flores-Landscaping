# Pages CMS 2.x — existing content only. See PAGES_CMS.md.
# Routes, layout, API settings and provider reviews are intentionally outside this schema.
media:
  - name: photos
    label: Website photos
    input: src/assets
    output: /src/assets
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: random
content:
