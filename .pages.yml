        path: src/content/business.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: primaryPhone
            label: Primary Phone
            type: string
            required: true
            pattern:
              regex: ^\+?[0-9() .-]{10,22}$
              message: Enter the business phone number, including area code.
          - name: secondaryPhone
            label: Secondary Phone
            type: string
            required: true
            pattern:
              regex: ^\+?[0-9() .-]{10,22}$
              message: Enter the business phone number, including area code.
          - name: email
            label: Email
            type: string
            required: true
            pattern:
              regex: ^[^\s@]+@[^\s@]+\.[^\s@]+$
              message: Enter a valid email address.
          - name: city
            label: City
            type: string
            required: true
          - name: state
            label: State
