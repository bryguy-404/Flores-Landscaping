components:
  photo:
    type: object
    fields:
      - name: image
        label: Choose or upload a photo
        type: image
        required: true
        options:
          media: photos
          extensions:
            - jpg
            - jpeg
            - png
            - webp
            - avif
          rename: random
        description: >-
          Select an existing photo or upload a replacement. Save this page after selecting it. Keep older
          files for other pages that may use them.
      - name: alt
        label: Alternative text
        type: string
        description: Describe the photo for people using screen readers. A decorative video cover can stay blank.
      - name: position
        label: Desktop crop focus
        type: string
        required: true
        pattern:
          regex: ^(100|[0-9]{1,2})% (100|[0-9]{1,2})%$
          message: Use two whole percentages from 0% to 100%, for example 50% 50%.
        description: >-
          Horizontal then vertical. 0% = left/top, 50% = center, 100% = right/bottom. The photo frame and page
          layout stay fixed.
      - name: mobilePosition
        label: Mobile crop focus
        type: string
        required: true
        pattern:
          regex: ^(100|[0-9]{1,2})% (100|[0-9]{1,2})%$
          message: Use two whole percentages from 0% to 100%, for example 30% 50%.
        description: >-
          Used at screen widths up to 767px. Adjust to keep the subject visible on phones. Full-photo viewers
          remain uncropped.
settings:
  hide: true
  content:
    merge: true
  commit:
    templates:
      update: "content: update {path} via Pages CMS"
