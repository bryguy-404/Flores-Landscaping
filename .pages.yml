            description: >-
              These four existing slots appear throughout the site. Page layout and the number of locations
              stay fixed.
          - name: experienceYears
            label: Experience Years
            type: string
            required: true
            pattern: ^[0-9]{1,3}$
          - name: hours
            label: Hours
            type: string
            required: false
